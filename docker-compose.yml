version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: daxul_labs_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - STORAGE_PATH=/app/uploads
      - STORAGE_PUBLIC_URL_PREFIX=/api/uploads/file
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=kp-proxy"
      - "traefik.http.routers.daxul.entrypoints=websecure"
      - "traefik.http.routers.daxul.rule=Host(`daxul.77.37.45.177.sslip.io`)"
      - "traefik.http.routers.daxul.tls=true"
      - "traefik.http.routers.daxul.tls.certresolver=letsencrypt"
      - "traefik.http.routers.daxul.service=daxul-app"
      - "traefik.http.services.daxul-app.loadbalancer.server.port=3000"

  postgres:
    image: postgres:16-alpine
    container_name: daxul_labs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # PostgreSQL port 5432 is strictly kept internal to Docker network for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

networks:
  internal:
    name: daxul_labs_internal
    driver: bridge
  traefik:
    name: kp-proxy
    external: true

volumes:
  postgres_data:
  uploads_data:
